# Categories for automatically generated release notes (Releases -> Generate release notes).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Новое / Features
      labels: [feature, enhancement]
    - title: Исправления / Fixes
      labels: [bug, fix]
    - title: Читалка и форматы / Reader & formats
      labels: [reader, formats]
    - title: Словари и перевод / Dictionaries & translation
      labels: [dictionary, translation]
    - title: Каталог и расширения / Catalog & extensions
      labels: [catalog, extensions]
    - title: Переводы интерфейса / Localization
      labels: [l10n]
    - title: Прочее / Other changes
      labels: ["*"]
