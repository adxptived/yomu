# A rolling "nightly" pre-release with APKs of the newest commit on main, published after CI passed on it.
# The APK names never change, so these links always point to the newest build:
#   https://github.com/<owner>/<repo>/releases/download/nightly/yomu-nightly-arm64-v8a.apk
#   https://github.com/<owner>/<repo>/releases/download/nightly/yomu-nightly-x86_64.apk
# versionName gets a "-nightly.<run>" suffix; "Check for updates" in the app ignores pre-releases.
name: Nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.YOMU_KEYSTORE_BASE64 != '' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Anything to build?
        id: changes
        run: |
          # Skip commits that only touch docs, store texts or artwork since the previous nightly.
          skip=false
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && git rev-parse -q --verify refs/tags/nightly > /dev/null; then
            if git diff --quiet nightly "$SHA" -- . ':(exclude)docs' ':(exclude)*.md' ':(exclude)fastlane' ':(exclude)branding' ':(exclude).github/ISSUE_TEMPLATE'; then
              skip=true
              echo "Nothing but docs changed since the previous nightly, skipping."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Version
        if: steps.changes.outputs.skip != 'true'
        id: version
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "suffix=-nightly.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.skip != 'true'

      - name: Restore signing keystore
        if: steps.changes.outputs.skip != 'true' && env.HAS_KEYSTORE == 'true'
        env:
          YOMU_KEYSTORE_BASE64: ${{ secrets.YOMU_KEYSTORE_BASE64 }}
        run: |
          echo "$YOMU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "YOMU_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        if: steps.changes.outputs.skip != 'true'
        env:
          YOMU_KEYSTORE_PASSWORD: ${{ secrets.YOMU_KEYSTORE_PASSWORD }}
          YOMU_KEY_ALIAS: ${{ secrets.YOMU_KEY_ALIAS }}
          YOMU_KEY_PASSWORD: ${{ secrets.YOMU_KEY_PASSWORD }}
          # OAuth client ids of the trackers (docs/TRACKING.md).
          YOMU_ANILIST_CLIENT_ID: ${{ secrets.YOMU_ANILIST_CLIENT_ID }}
          YOMU_MAL_CLIENT_ID: ${{ secrets.YOMU_MAL_CLIENT_ID }}
          YOMU_SHIKIMORI_CLIENT_ID: ${{ secrets.YOMU_SHIKIMORI_CLIENT_ID }}
          YOMU_SHIKIMORI_CLIENT_SECRET: ${{ secrets.YOMU_SHIKIMORI_CLIENT_SECRET }}
        run: ./gradlew assembleRelease "-Pyomu.versionSuffix=${{ steps.version.outputs.suffix }}"

      - name: Publish the nightly release
        if: steps.changes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}${{ steps.version.outputs.suffix }}
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$apk" "dist/yomu-nightly-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "Сборка последнего коммита \`main\` — для проверки, может быть нестабильной."
            echo "Build of the newest commit on \`main\`, for testing; may be unstable."
            echo
            echo "- Версия / version: \`$VERSION\`"
            echo "- Коммит / commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA"
            echo "- Собрано / built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if [ "$HAS_KEYSTORE" != "true" ]; then
              echo
              echo "> ⚠️ Подписано временным debug-ключом: каждую сборку придётся ставить заново."
              echo "> Signed with a throwaway debug key: every build needs a clean install."
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release delete nightly --cleanup-tag --yes 2> /dev/null || true
          git push origin ":refs/tags/nightly" 2> /dev/null || true
          gh release create nightly dist/*.apk dist/SHA256SUMS.txt \
            --target "$SHA" --prerelease --latest=false \
            --title "Nightly $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
