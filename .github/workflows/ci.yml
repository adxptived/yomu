name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Debug APK
        run: ./gradlew assembleDebug

      - name: Unit and Robolectric tests (records review screenshots)
        run: ./gradlew testDebugUnitTest :domain:test :sources:opds:test :sources:mangadex:test :sources:novels:test -Proborazzi.test.record=true

      - name: Snapshot tests
        # A PNG comparison against the approved images, not another recording: the artifacts of the step above are for
        # review only. See docs/VISUAL_TESTS.md.
        if: ${{ matrix.java == 21 && hashFiles('app/src/test/screenshots/**/*.png') != '' }}
        run: |
          rm -rf app/build/outputs/roborazzi
          mkdir -p app/build/outputs/roborazzi
          cp -R app/src/test/screenshots/. app/build/outputs/roborazzi/
          ./gradlew :app:testDebugUnitTest -Proborazzi.test.verify=true

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-java${{ matrix.java }}
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Android lint
        if: matrix.java == 21
        run: ./gradlew lintDebug

      - name: Detekt
        if: matrix.java == 21
        run: ./gradlew detekt

      # A release without the real keystore is refused by the build now (the debug key is public). The R8 build is
      # checked through "fast", which is release code under the debug package and debug signer.
      - name: Release-like APK (R8, debug package)
        if: matrix.java == 21
        run: ./gradlew assembleFast

      - name: Upload debug APK
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: yomu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release-like APK
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: yomu-fast-apk
          path: app/build/outputs/apk/fast/*.apk

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-java${{ matrix.java }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

