name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Debug APK
        run: ./gradlew assembleDebug

      - name: Unit and Robolectric tests
        run: ./gradlew testDebugUnitTest :domain:test :sources:opds:test :sources:mangadex:test :sources:novels:test -Proborazzi.test.record=true

      - name: Android lint
        if: matrix.java == 21
        run: ./gradlew lintDebug

      - name: Detekt (informational)
        if: matrix.java == 21
        continue-on-error: true
        run: ./gradlew detekt

      - name: Release APK (R8, debug-signed without secrets)
        if: matrix.java == 21
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        if: matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: yomu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: yomu-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-java${{ matrix.java }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
