# Publishes a GitHub release with the APKs when a version tag is pushed:
#
#   git tag v1.6.0 && git push origin v1.6.0
#
# The tag must match versionName in app/build.gradle.kts ("v" + versionName). A tag with a suffix (v1.6.0-beta.1)
# builds versionName + suffix and is published as a pre-release. Release notes come from the matching "## 1.6.0"
# section of CHANGELOG.md, followed by the list of merged pull requests. Signing: see docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, e.g. v1.6.0 (empty: "v" + versionName; a missing tag is created on the chosen branch)'
        required: false
        default: ''
      draft:
        description: 'Create a draft instead of publishing'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip unit and Robolectric tests'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KEYSTORE: ${{ secrets.YOMU_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"
          else tag="v$name"; fi
          version="${tag#v}"
          base="${version%%-*}"
          suffix="${version#"$base"}"
          if [ -z "$name" ] || [ "$base" != "$name" ]; then
            echo "::error file=app/build.gradle.kts::Tag $tag does not match versionName \"$name\". Bump versionName (and versionCode) or tag v$name."
            exit 1
          fi
          prerelease=false
          [ -n "$suffix" ] && prerelease=true
          [ "$HAS_KEYSTORE" != "true" ] && prerelease=true
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "name=$name"
            echo "code=$code"
            echo "suffix=$suffix"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Building $tag: versionName $version, versionCode $code, pre-release: $prerelease"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          YOMU_KEYSTORE_BASE64: ${{ secrets.YOMU_KEYSTORE_BASE64 }}
        run: |
          echo "$YOMU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "YOMU_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn about debug signing
        if: env.HAS_KEYSTORE != 'true'
        run: >-
          echo "::warning::YOMU_KEYSTORE_BASE64 is not set: the APKs are signed with a throwaway debug key and the
          release is published as a pre-release (it will not install over a signed version). See docs/RELEASING.md."

      - name: Tests
        if: ${{ !inputs.skip_tests }}
        run: ./gradlew testDebugUnitTest :domain:test :sources:opds:test :sources:mangadex:test :sources:novels:test

      - name: Release APK
        env:
          YOMU_KEYSTORE_PASSWORD: ${{ secrets.YOMU_KEYSTORE_PASSWORD }}
          YOMU_KEY_ALIAS: ${{ secrets.YOMU_KEY_ALIAS }}
          YOMU_KEY_PASSWORD: ${{ secrets.YOMU_KEY_PASSWORD }}
          # OAuth client ids of the trackers (docs/TRACKING.md); empty = users enter their own in Settings → Tracking.
          YOMU_ANILIST_CLIENT_ID: ${{ secrets.YOMU_ANILIST_CLIENT_ID }}
          YOMU_MAL_CLIENT_ID: ${{ secrets.YOMU_MAL_CLIENT_ID }}
          YOMU_SHIKIMORI_CLIENT_ID: ${{ secrets.YOMU_SHIKIMORI_CLIENT_ID }}
          YOMU_SHIKIMORI_CLIENT_SECRET: ${{ secrets.YOMU_SHIKIMORI_CLIENT_SECRET }}
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: ./gradlew assembleRelease ${SUFFIX:+"-Pyomu.versionSuffix=$SUFFIX"}

      - name: Collect APKs
        id: dist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            cp "$apk" "dist/yomu-$TAG-$abi.apk"
          done
          cp app/build/outputs/mapping/release/mapping.txt "dist/yomu-$TAG-mapping.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -n "$apksigner" ]; then
            cert=$("$apksigner" verify --print-certs "$(ls dist/*.apk | head -n1)" | sed -nE 's/.*certificate SHA-256 digest: (.*)/\1/p' | head -n1)
            echo "cert=$cert" >> "$GITHUB_OUTPUT"
            echo "Signing certificate SHA-256: $cert"
          fi

      - name: Release notes
        env:
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          CERT: ${{ steps.dist.outputs.cert }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          # The "## <version>" section of CHANGELOG.md, up to the next "## ".
          awk -v v="$NAME" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::warning file=CHANGELOG.md::No \"## $NAME\" section in CHANGELOG.md, the notes only list pull requests."
          fi
          {
            echo
            echo "### Install"
            echo
            echo "- \`yomu-$TAG-arm64-v8a.apk\` — телефоны и планшеты / phones and tablets"
            echo "- \`yomu-$TAG-x86_64.apk\` — эмуляторы, x86 / emulators, x86 devices"
            echo "- \`SHA256SUMS.txt\` — контрольные суммы / checksums"
            if [ "$HAS_KEYSTORE" != "true" ]; then
              echo
              echo "> ⚠️ Подписано временным debug-ключом: не ставится поверх подписанной версии."
              echo "> Signed with a throwaway debug key: it does not install over a signed version."
            elif [ -n "$CERT" ]; then
              echo
              echo "SHA-256 сертификата подписи / signing certificate: \`$CERT\`"
            fi
          } >> "$notes"
          cat "$notes"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Yomu ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/*-mapping.txt

      - name: Summary
        if: success()
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Yomu $TAG"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "[Release page]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
