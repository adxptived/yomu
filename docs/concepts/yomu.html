<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yomu · Концепты интерфейса</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#27282e);font:16px/1.45 Roboto,system-ui,sans-serif}main{max-width:1040px;margin:auto}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c77738;outline-offset:2px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0}.brand{font:italic bold 27px Georgia,serif;margin-right:auto}.tools select,.tools button{background:var(--secondary,#eeeae3);color:inherit;border:0;border-radius:8px;padding:9px}.stage{display:grid;grid-template-columns:minmax(0,440px) minmax(160px,1fr);gap:clamp(18px,4vw,55px);align-items:start}
.screen{--paper:#fcf9f4;--ink:#222128;--muted:#595754;--layer:#f0ece5;--line:#d9d4cc;--blue:#3b4ba6;--onblue:white;background:var(--paper);color:var(--ink);border-radius:24px;border:1px solid var(--line);overflow:hidden;box-shadow:0 12px 36px #29242116;min-width:0}.screen.dark{--paper:#15161b;--ink:#eeeae4;--muted:#c5c1c0;--layer:#27282e;--line:#41434b;--blue:#bac3ff;--onblue:#182367}.inside{padding:22px;min-height:526px}.sys,.between,.row,.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}.sys{font-size:12px;font-weight:bold;padding:14px 22px 0}.sys span:last-child{letter-spacing:1px}.muted,small,aside p{color:var(--muted,#68676b)}h1,h2,h3,p{margin:0}h1,h2,.name{font-family:Georgia,"Times New Roman",serif;font-weight:normal;line-height:1.1}h1{font-size:2.05em;margin:10px 0 20px}h2{font-size:1.38em;margin:22px 0 12px}.name{font-size:1.6em}.screen button{background:var(--layer);color:var(--ink);border:0;border-radius:11px;padding:9px 13px;min-height:44px}.screen .primary{background:var(--blue);color:var(--onblue);font-weight:650}.lead{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--layer);display:grid;grid-template-columns:80px 1fr;gap:13px}.lead .primary{grid-column:1/-1}.lead p{font-size:.87em;margin:.5em 0}.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.screen .tile{padding:0;text-align:left;background:none;align-self:start}.tile small{display:block;margin-top:6px}.cover{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:6px;aspect-ratio:2/3;border-radius:2px 7px 7px 2px;padding:10%;box-shadow:inset 3px 0 0 #ffffff36,inset 5px 0 0 #0002;color:#fff5df;background:#273b60}.cover:before{content:"";position:absolute;inset:38% -30% -30%;z-index:-1;transform:rotate(-17deg);background:repeating-radial-gradient(ellipse at 50% 100%,#a7bfc0 0 2%,transparent 3% 7%)}.cover.gold{background:#c49047;color:#241c17}.cover.gold:before{background:repeating-linear-gradient(135deg,#724a28 0 3%,transparent 3% 9%)}.cover.red{background:#823f37}.cover.red:before{background:repeating-radial-gradient(circle at 20% 35%,#db927b 0 3%,transparent 4% 11%)}.cover b{font:normal clamp(13px,2vw,23px)/1.02 Georgia,serif;overflow-wrap:break-word}.cover i{font:normal 9px/1.1 system-ui;letter-spacing:.05em}.bar{width:100%;height:5px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.nav{border-top:1px solid var(--line);padding:9px 5px}.nav button{flex:1;background:none;padding:7px 2px;font-size:.82em}.nav .active{background:var(--layer);color:var(--blue);font-weight:bold}.item{border-bottom:1px solid var(--line);padding:13px 0}.item small,.hero small{display:block;margin-top:3px}.hero{display:grid;grid-template-columns:94px 1fr;align-items:center;gap:16px;margin:18px 0}.reading{font:1.14em/1.64 Georgia,serif}.reading p+p{margin-top:1em}.sheet{padding:15px;margin-top:18px;background:var(--layer);border-radius:16px}.sheet label{display:block;margin:8px 0}.sheet input,input[type=range]{width:100%;accent-color:var(--blue)}.audioArt{max-width:150px;margin:8px auto 18px}.center{text-align:center}.wide{width:100%;margin:12px 0}.screen input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--layer);color:var(--ink);padding:12px}.note{border-left:3px solid var(--blue);padding-left:14px;margin-top:20px;font:1.25em/1.5 Georgia,serif}aside{padding:18px 0}aside h2{margin-top:0}aside p{max-width:36ch;margin:.7em 0}.large{font-size:21px}.large .books{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:570px){.stage{display:flex;flex-direction:column;gap:0}.screen{width:100%}.inside{min-height:435px;padding:17px}.tools{gap:5px}.tools select{max-width:48%}aside{padding:13px 3px}.brand{font-size:23px}.tools button{font-size:14px}}
aside p{color:var(--muted-foreground,#68676b)}.lead .cover b{font-size:13px}.cover.gold b{color:#23160e}
</style>
<main><header class="tools"><span class="brand">Yomu</span><select id="views" aria-label="Экран концепта"></select><button id="theme">Тёмная тема</button><button id="size" aria-pressed="false" aria-label="Увеличить текст">Аа</button></header>
<div class="stage"><section id="screen" class="screen" aria-label="Макет приложения"><div class="sys"><span>09:41</span><span>LTE ▰</span></div><div id="body" class="inside"></div><nav id="nav" class="nav" aria-label="Разделы"></nav></section><aside><h2 id="caption"></h2><p id="intent"></p><p id="try"></p></aside></div></main>
<script>
const el=id=>document.getElementById(id);
const pages={
 home:['Первый запуск','Первый запуск','Две точки входа ведут к локальным книгам и сетевым источникам.','Выберите подборку или откройте каталог.'],
 library:['Библиотека','Продолжение на полке','Текущая книга, место остановки и действие собраны в одну карточку. Остальные произведения остаются на полке.','Откройте обложку или продолжите чтение.'],
 details:['Карточка книги','Подробности произведения','На первом плане обложка, название и действие по формату. Ниже — место остановки и описание.','Откройте книгу. Для аудио откроется плеер.'],
 reader:['Чтение и оформление','Страница и оформление','Панель размера текста открывается поверх сценария чтения. Изменение сразу видно в тексте.','Нажмите «Оформление», измените размер и вернитесь к странице.'],
 catalog:['Каталог','Поиск по источникам','Поле поиска остаётся над результатами. При пустой выдаче доступен сброс запроса.','Введите название книги или слово без совпадений.'],
 downloads:['Загрузки','Очередь загрузок','Для каждого произведения видны состояние главы и доступное действие.','Повторите загрузку с ошибкой и откройте главу.'],
 audio:['Аудиоплеер','Глава и позиция','Обложка, время и воспроизведение образуют один блок. Перемотка действует в пределах главы.','Переместите ползунок или переключите состояние плеера.'],
 personal:['Профиль и заметки','Возврат к фрагменту','Цитата стоит рядом с книгой и главой. Из профиля можно перейти к заметке и настройкам.','Нажмите на фрагмент или откройте настройки.'],
 settings:['Настройки','Оформление приложения','У параметра видно текущее значение. Тема и размер меняются прямо в концепте.','Включите тёмную тему и крупный текст, затем вернитесь в библиотеку.']
};
const books=[['Атлас приливов','Мира Орлова','', 'EPUB'],['Дом ветров','Лев Арден','gold','Аудио'],['По ту сторону сада','Анна Север','red','EPUB']];
const passage=['К утру вода отступила, и на песке проступила узкая дорога. Мира раскрыла карту. Там, где ещё вчера было только море, тянулась тонкая белая линия.','Она сложила лист вчетверо и пошла по влажному песку. На другой стороне бухты медленно просыпался маяк.'];
const garden=['За калиткой пахло дождём. В глубине сада кто-то оставил на скамье сложенное письмо.','Анна остановилась у яблони. С мокрых веток падали капли, и каждая оставляла на конверте тёмный след.'];
let view='library',book=0,origin='library',panel=false,font=19,playing=false,seconds=754,done=false,query='',dark=false,large=false;
const cover=i=>'<div class="cover '+books[i][2]+'"><b>'+books[i][0]+'</b><i>'+books[i][1]+'</i></div>';
const button=(label,action,c='')=>'<button class="'+c+'" data-act="'+action+'">'+label+'</button>';
const bar=n=>'<div class="bar"><i style="width:'+n+'%"></i></div>';
const title=t=>'<h1>'+t+'</h1>';
const row=(a,b)=>'<div class="between item"><div>'+a+'</div>'+b+'</div>';
const clock=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function results(){const hits=books.map((b,i)=>({b,i})).filter(({b})=>b.slice(0,2).join(' ').toLowerCase().includes(query.trim().toLowerCase()));return hits.map(({b,i})=>row('<strong>'+b[0]+'</strong><small>'+b[1]+' · '+b[3]+'</small>',button('Открыть','book'+i))).join('')||'<h2>Совпадений нет</h2>'+button('Очистить поиск','clear')}
function content(){
 const b=books[book];
 switch(view){
 case 'home':return title('С чего начнём?')+'<div class="books">'+books.map((_,i)=>cover(i)).join('')+'</div><h2>Ваша первая полка</h2><p>Посмотрите, как устроена библиотека, на примере трёх произведений.</p>'+button('Открыть подборку','library','primary wide')+button('Найти в каталоге','catalog','wide');
 case 'library':return title('Библиотека')+'<div class="lead">'+cover(0)+'<div><small>Вы читаете</small><div class="name">Атлас приливов</div><p>Глава 4 · У кромки воды</p>'+bar(38)+'<small>38 % прочитано</small></div>'+button('Продолжить чтение','resume','primary')+'</div><h2>Моя полка</h2><div class="books">'+books.map((b,i)=>button(cover(i)+'<small>'+b[3]+'</small>','book'+i,'tile')).join('')+'</div>';
 case 'details':return button('← Назад',origin)+'<div class="hero">'+cover(book)+'<div><small>'+b[3]+'</small><h1>'+b[0]+'</h1>'+b[1]+'</div></div>'+button(book===1?'Слушать':book===0?'Продолжить чтение':'Читать','open','primary wide')+'<h2>'+(book===2?'Начало книги':'Место остановки')+'</h2><p>'+(book===1?'Глава 2 · '+clock(seconds):book===0?'Глава 4 · У кромки воды':'Глава 1 · Письмо')+'</p><h2>О произведении</h2><p>'+['Путевые записи картографа, которая изучает исчезающие дороги у моря.','История семьи, живущей в доме над обрывом.','После долгого отсутствия Анна возвращается в сад своего детства.'][book]+'</p>';
 case 'reader':return '<div class="between">'+button('← К книге','details')+button(panel?'Закрыть панель':'Оформление','panel')+'</div><h2>'+b[0]+'</h2><small>Глава '+(book===2?'1':'4')+'</small>'+title(book===2?'Письмо':'У кромки воды')+'<article class="reading" style="font-size:'+font/16+'em">'+(book===2?garden:passage).map(p=>'<p>'+p+'</p>').join('')+'</article>'+(panel?'<div class="sheet"><strong>Оформление книги</strong><label for="font">Размер текста · <output id="pt">'+font+'</output></label><input id="font" type="range" min="16" max="28" value="'+font+'"></div>':'');
 case 'catalog':return title('Каталог')+'<input aria-label="Найти книгу или автора" type="search" id="search" placeholder="Книга или автор"><h2>Демо-каталог</h2><div id="hits">'+results()+'</div>'+button('Загрузки','downloads','wide');
 case 'downloads':return title('Загрузки')+row('Атлас приливов<small>Глава 4 · Доступно офлайн</small>',button('Читать','resume'))+row('По ту сторону сада<small>'+(done?'Глава 1 · Доступно офлайн':'Глава 1 · Соединение прервано')+'</small>',button(done?'Читать':'Повторить',done?'garden':'retry'));
 case 'audio':return button('← К книге','details')+'<div class="audioArt">'+cover(1)+'</div><div class="center"><small>Глава 2</small>'+title('Дом ветров')+'<p>Лев Арден</p></div><input id="seek" aria-label="Позиция в главе" type="range" min="0" max="1682" value="'+seconds+'"><div class="between"><small id="time">'+clock(seconds)+'</small><small>28:02</small></div><div class="row">'+button('−15 с','rewind')+button(playing?'Пауза':'Слушать','play','primary')+button('+15 с','forward')+'</div>';
 case 'personal':return title('Профиль')+row('История чтения<small>Сегодня · Атлас приливов</small>',button('Открыть','resume'))+'<h2>Мои заметки</h2><blockquote class="note">'+passage[0].split('. ')[0]+'.</blockquote><small>Атлас приливов · Глава 4</small>'+button('К фрагменту','resume','wide')+button('Настройки','settings','wide');
 case 'settings':return title('Настройки')+'<h2>Оформление</h2>'+row('Тема приложения',button(dark?'Тёмная':'Светлая','theme'))+row('Размер интерфейса',button(large?'Крупный':'Обычный','size'));
 }}
function render(){
 const p=pages[view];el('screen').className='screen'+(dark?' dark':'')+(large?' large':'');el('theme').textContent=dark?'Светлая тема':'Тёмная тема';el('size').setAttribute('aria-pressed',large);
 el('views').value=view;el('caption').textContent=p[1];el('intent').textContent=p[2];el('try').textContent=p[3];el('body').innerHTML=content();
 const group=['catalog','downloads'].includes(view)?'catalog':['personal','settings'].includes(view)?'personal':'library';
 el('nav').innerHTML=['library','catalog','personal'].map((k,i)=>button(['Библиотека','Каталог','Профиль'][i],k,k===group?'active':'')).join('');
 el('nav').hidden=['home','reader','audio'].includes(view);el('nav').style.display=el('nav').hidden?'none':'flex';if(view==='catalog')el('search').value=query;
}
function go(k){if(k==='audio')book=1;if(k==='reader'&&book===1)book=0;view=k;panel=false;render()}
function act(a){
 if(/^book\d$/.test(a)){book=Number(a.slice(-1));origin=view;return go('details')}
 if(a==='resume'||a==='garden'){book=a==='resume'?0:2;origin=view;return go('reader')}
 if(a==='open')return go(book===1?'audio':'reader');
 if(a==='clear'){query='';render();el('search').focus();return}
 if(a in pages)return go(a);
 if(a==='size')large=!large;if(a==='theme')dark=!dark;if(a==='panel')panel=!panel;if(a==='retry')done=true;if(a==='play')playing=!playing;
 if(a==='rewind'||a==='forward')seconds=Math.min(1682,Math.max(0,seconds+(a==='forward'?15:-15)));render();
}
el('views').innerHTML=Object.entries(pages).map(([k,p])=>'<option value="'+k+'">'+p[0]+'</option>').join('');
el('views').onchange=e=>go(e.target.value);el('size').onclick=()=>act('size');el('theme').onclick=()=>act('theme');
el('screen').onclick=e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act)};
el('screen').oninput=e=>{const t=e.target;if(t.id==='search'){query=t.value;el('hits').innerHTML=results()}if(t.id==='font'){font=+t.value;el('pt').textContent=font;document.querySelector('.reading').style.fontSize=font/16+'em'}if(t.id==='seek'){seconds=+t.value;el('time').textContent=clock(seconds)}};
setInterval(()=>{if(!playing)return;seconds=Math.min(1682,seconds+1);if(view==='audio'){el('seek').value=seconds;el('time').textContent=clock(seconds)}if(seconds===1682){playing=false;if(view==='audio')render()}},1000);
render();
</script></html>
